  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243644" transform="translate(50.4 462.3)">Finite sampled configurations and fixed continuation policies; both selectors know the decklists.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243644" transform="translate(50.4 478.8)">H counts opponent deck + hand + Prizes. These results do not bound an optimal perfect-information solver.</text>
